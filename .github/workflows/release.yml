name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: artifacts/client
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-server-windows-x64
          path: artifacts/server
      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-android-arm64-v8a
          path: artifacts/android
      - name: Prepare packages
        run: |
          mkdir -p dist
          cp CHANGELOG.md LICENSE NOTICE.md README.md artifacts/client/
          cp CHANGELOG.md LICENSE NOTICE.md README.md artifacts/server/
          cp artifacts/android/DoABarrelRoll.so dist/
          cp artifacts/android/DoABarrelRoll.levipack dist/
      - name: Package Windows client
        run: zip -r "$GITHUB_WORKSPACE/dist/$REPOSITORY_NAME-client-windows-x64.zip" .
        working-directory: artifacts/client
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
      - name: Package Windows server
        run: zip -r "$GITHUB_WORKSPACE/dist/$REPOSITORY_NAME-server-windows-x64.zip" .
        working-directory: artifacts/server
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*-client-windows-x64.zip
            dist/*-server-windows-x64.zip
            dist/DoABarrelRoll.so
            dist/DoABarrelRoll.levipack
